name: SecuSign prototype checks
on:
  push:
    branches: [main]
    paths: ['SecuSign.py', 'requirements.txt', 'tests/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['SecuSign.py', 'requirements.txt', 'tests/**', '.github/workflows/ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile SecuSign.py
      - run: python -m unittest discover -s tests -v
